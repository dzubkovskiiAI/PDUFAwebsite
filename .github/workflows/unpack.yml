name: Unpack project zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository contents with the zip
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
          test -n "$ZIP" || { echo "No zip file found in the repository root"; exit 1; }
          rm -rf /tmp/unz && mkdir /tmp/unz && unzip -q "$ZIP" -d /tmp/unz
          if [ -d /tmp/unz/pipeline ]; then SRC=/tmp/unz; else SRC=$(find /tmp/unz -mindepth 1 -maxdepth 1 -type d | head -n 1); fi
          test -d "$SRC/pipeline" || { echo "The zip does not contain a pipeline folder"; exit 1; }
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          (cd "$SRC" && tar cf - --exclude=./.github .) | tar xf -
          git config user.name "pdufa-bot"
          git config user.email "pdufa-bot@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project" || echo "nothing to commit"
          git push
